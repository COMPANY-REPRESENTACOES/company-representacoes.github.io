<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1c1c1e">
<title>Company Vendas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Company Vendas">
<style>
:root{
  --bg:#f3f4f7; --surface:#fff; --surface-2:#f8f9fb; --text:#16181d; --muted:#667085; --border:#e3e6ec;
  --accent:#1c1c1e; --accent-2:#3a3a3e; --accent-ink:#f2c14e; --gold:#d99a2b; --gold-2:#f2c14e; --gold-dark:#a8711a; --silver:#c8c8cc;
  --ok:#1f8a4c; --warn:#a15c07; --bad:#c62828; --chip:#eef1f5;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1217; --surface:#171b22; --surface-2:#1c212a; --text:#eef0f4; --muted:#9aa3b2; --border:#2a313c;
    --accent:#f2c14e; --accent-2:#d99a2b; --accent-ink:#1c1c1e; --gold:#d99a2b; --gold-2:#f2c14e; --gold-dark:#f2c14e; --silver:#8e8e93; --chip:#26262a;
    --ok:#4ac47f; --warn:#e6a23c; --bad:#ef6b6b; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1217; --surface:#171b22; --surface-2:#1c212a; --text:#eef0f4; --muted:#9aa3b2; --border:#2a313c;
  --accent:#f2c14e; --accent-2:#d99a2b; --accent-ink:#1c1c1e; --gold:#d99a2b; --gold-2:#f2c14e; --gold-dark:#f2c14e; --silver:#8e8e93; --chip:#26262a;
  --ok:#4ac47f; --warn:#e6a23c; --bad:#ef6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.top-row{display:flex;align-items:center;gap:12px;min-height:56px}
.top-row img{height:34px;border-radius:6px;background:#fff;padding:2px}
.top-title{font-weight:800;font-size:16px;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.sync{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.off .dot{background:var(--bad)}
.sync.pend .dot{background:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
nav.tabs a.on{color:var(--accent);border-color:var(--accent)}
main{padding:16px 0 120px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:16px;margin:18px 0 8px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--accent)}
label.lb{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .ct{opacity:.7;font-weight:600;margin-left:2px}
.list{display:grid;gap:10px;margin-top:12px}
.ped{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;text-decoration:none;color:inherit}
.ped b{font-size:15px}
.ped .tot{font-weight:800;text-align:right}
.ped .meta{font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:800;letter-spacing:.02em;background:var(--chip);color:var(--text);white-space:nowrap}
.st-recebido{background:#fde8c8;color:#7a4a00}
.st-em_revisao{background:#e2ecfb;color:#163e75}
.st-espelho_enviado{background:#efe3fb;color:#5a2a86}
.st-aprovado{background:#dbf3e4;color:#0f5a2c}
.st-enviado_fabrica{background:#d7f0f4;color:#0b5560}
.st-faturado{background:#1f8a4c;color:#fff}
.st-cancelado{background:#fbe0e0;color:#8f1b1b}
.b-express{background:#fff3cd;color:#7a5a00;border:1px solid #f0d27a}
.b-pend{background:#fde8c8;color:#7a4a00}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* editor */
.it{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.it:first-child{border-top:0}
.it img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--border)}
.it .cod{font-weight:800;font-size:13px}
.it .ds{font-size:13px;color:var(--muted)}
.it .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.qty{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:34px;height:34px;font-size:18px;font-weight:700}
.qty input{width:52px;border:0;text-align:center;height:34px;background:var(--surface);font-weight:800}
.price-in{width:110px;border:1.5px solid var(--border);border-radius:10px;height:36px;padding:0 8px;text-align:right;font-weight:700;background:var(--surface)}
.price-in.changed,.qty.changed{border-color:var(--warn)}
.lt{margin-left:auto;font-weight:800}
.rm{border:0;background:transparent;color:var(--bad);font-size:18px;padding:4px 8px}
.totbar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid var(--border);font-weight:800;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--border);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.actions .wrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.note{border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;margin:10px 0}
.note.warn{background:#fdecc8;color:#6b4300}
.note.info{background:#e2ecfb;color:#163e75}
.note.bad{background:#fbe0e0;color:#8f1b1b}
.note.ok{background:#dbf3e4;color:#0f5a2c}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:18px;max-height:86vh}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.sheet-h b{flex:1;font-size:16px}
.sheet-b{overflow:auto;padding:12px 16px}
.cat-it{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.cat-it img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--border)}
.cat-it .pr{font-weight:800}
.cat-it .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cat-it.unav{opacity:.6}
.tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:#d31c2b;color:#fff;margin-left:4px;vertical-align:middle}
.tag.ind{background:#555}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{padding:6px 4px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.tb td.r,table.tb th.r{text-align:right}
.login{max-width:380px;margin:8vh auto 0}
.login img{display:block;margin:0 auto 12px;height:70px;background:#fff;border-radius:10px;padding:4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#16181d;color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;z-index:80;max-width:90vw;text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}

/* cores da marca Company: grafite, dourado e prata */
a.btn{color:var(--text)}a.btn.pri{color:#1c1c1e}
header.top{background:#1c1c1e;border-bottom:3px solid var(--gold);color:#fff}
.top-row img{background:transparent;padding:0;height:40px}
.top-title{color:#fff}.top-title small{color:#c8c8cc}
.sync{background:#2a2a2e;border-color:#3a3a3e;color:#fff}
nav.tabs a{color:#b9b9be}
nav.tabs a.on{color:#f2c14e;border-color:#f2c14e}
.btn.pri{background:linear-gradient(180deg,#f2c14e,#d99a2b);border-color:#c08420;color:#1c1c1e}
.btn.pri:hover{filter:brightness(1.05)}
.chip[aria-pressed="true"]{background:#1c1c1e;border-color:#1c1c1e;color:#f2c14e}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--gold)}
.qty input:focus,.price-in:focus{outline:2px solid var(--gold)}
.login{border-top:4px solid var(--gold)}
.login img{background:transparent}
.toast{background:#1c1c1e;color:#fff;border:1px solid var(--gold)}
.note.info{background:#fbf1d9;color:#6b4a0c}
.tag[style*="var(--accent)"]{background:#1c1c1e!important;color:#f2c14e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:#f2c14e;border-color:#f2c14e;color:#1c1c1e}:root:not([data-theme="light"]) .note.info{background:#3a2f16;color:#f2d79a}}

/* botões quadradinhos (estilo barra de ferramentas) */
.btn{border-radius:4px;padding:9px 14px;font-weight:600;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.btn.sm{border-radius:4px;padding:6px 10px}
.btn:not(.pri):not(.ok){background:#efeff1;border-color:#dcdce0}
.btn:not(.pri):not(.ok):hover{background:#e4e4e8}
.btn.pri{background:#d99a2b;border-color:#c08420;color:#1c1c1e}
.btn.pri:hover{background:#e6a93a;filter:none}
.chip{border-radius:4px;padding:7px 12px;font-weight:600;background:#efeff1;border-color:#dcdce0}
.chip[aria-pressed="true"]{background:#1c1c1e;border-color:#1c1c1e;color:#f2c14e}
.sync{border-radius:4px}
.badge{border-radius:3px}
input.in,select.in,textarea.in,.price-in,.qty{border-radius:4px}
.qty button{border-radius:0}
.card{border-radius:6px}
.sheet{border-radius:8px 8px 0 0}
@media (min-width:700px){.sheet{border-radius:8px}}
.note{border-radius:4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.pri):not(.ok),:root:not([data-theme="light"]) .chip{background:#26262a;border-color:#35353a}:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:#f2c14e;color:#1c1c1e}}
</style>
</head>
<body>
<img id="compLogo" src="company.png" alt="" hidden>
<div id="app"></div>
<script src="config.js"></script>
<script src="pdflib.js"></script>
<script src="app.js"></script>
</body>
</html>
